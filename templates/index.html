<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>IA Hack - Sons marins</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    background: linear-gradient(rgba(0,20,40,0.8), rgba(0,20,40,0.9)),
                url("{{ url_for('static', filename='images/baleine.jpg') }}");
    background-size: cover;
    background-position: center;
}
.navbar {
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
}

.navbar-brand {
    font-weight: bold;
    color: #00d4ff !important;
}

.nav-link {
    color: white !important;
    transition: 0.3s;
}

.nav-link:hover {
    color: #00d4ff !important;
}

/* MAIN CARD */
.main-card {
    width: 750px;
    border-radius: 25px;
    padding: 30px;
    margin-top: 80px;

    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);

    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* SECTIONS */
.section {
    background: rgba(0,0,0,0.3);
    border-radius: 20px;
    padding: 20px;
    transition: 0.3s;
}

.section:hover {
    transform: translateY(-5px);
}

/* TITRE */
h2 {
    color: #00d4ff;
}

/* BUTTON */
.btn-primary {
    background: linear-gradient(45deg, #00d4ff, #007bff);
    border: none;
    font-weight: bold;
}

.btn-primary:hover {
    transform: scale(1.05);
}

/* RESULT */
.animal-img {
    max-width: 250px;
    border-radius: 15px;
    margin-top: 10px;
}

/* FOOTER */
footer {
    margin-top: 60px;
    background: rgba(0,0,0,0.8);
    padding: 30px;
}

</style>
</head>


</html>
